name: Publish to CurseForge/ModRinth
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check the release without publishing it"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/mc1.21.1/dev'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/actions/wrapper-validation@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Refuse to publish an already released version
        if: ${{ !inputs.dry_run }}
        run: |
          mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          tag="mc${mc}-${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "::error::Release tag ${tag} already exists: bump mod_version before publishing"
            exit 1
          fi

      - name: Publish Mods
env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: ./gradlew build publishMods
